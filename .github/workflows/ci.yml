name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.8'

jobs:
  quality-check:
    name: Code Quality & Basic Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    
    - name: Lint with flake8
      run: |
        flake8 docker/dags/etl/ docker/dags/ docker/dags/scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 docker/dags/etl/ docker/dags/ docker/dags/scripts/ --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
    
    - name: Type checking with mypy
      run: |
        mypy docker/dags/etl/ --ignore-missing-imports
    
    - name: Security check with bandit
      run: |
        bandit -r docker/dags/etl/ -f json -o bandit-report.json || true
    
  docker-validation:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: quality-check
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create dummy .env file
      run: |
        # Create minimal .env file for validation
        mkdir -p docker
        cat > docker/.env << 'EOF'
        # CI dummy environment variables
        POSTGRES_DB=test_db
        POSTGRES_USER=test_user
        POSTGRES_PASSWORD=test_pass
        MINIO_ROOT_USER=minioadmin
        MINIO_ROOT_PASSWORD=minioadmin123
        REDIS_PASSWORD=test_redis_pass
        AIRFLOW_UID=1000
        AIRFLOW_GID=0
        EOF
    
    - name: Validate Docker Compose
      run: |
        docker compose -f docker/docker-compose.yml config
    
    - name: Build Docker images (no cache for validation)
      run: |
        docker compose -f docker/docker-compose.yml build --no-cache
